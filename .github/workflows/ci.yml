name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Тесты
        run: node --test 'mod/**/*.test.ts' '.github/scripts/*.test.mjs'
      - name: Валидация плагина
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - name: Версия поднята
        run: node .github/scripts/check-version.mjs "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}"

  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Тег и релиз новой версии
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version .claude-plugin/plugin.json)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag уже есть — релиз не нужен"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "dev-kit ${tag#v}" --generate-notes
